name: Continuous Integration 🧪

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js version
        required: true
        default: 22.x
        type: string
      pnpm-version:
        description: pnpm version
        required: true
        default: 10.x
        type: string

jobs:
  setup:
    name: Setup 🔧
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v2
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies 📚
        run: pnpm install

      - name: Cache workspace 💾
        uses: actions/cache@v3
        with:
          path: .
          key: workspace-${{ github.sha }}

  lint:
    name: Lint 🧹
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Restore workspace 📂
        uses: actions/cache@v3
        with:
          path: .
          key: workspace-${{ github.sha }}

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v2
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Run linter 🧹
        run: pnpm lint

  build:
    name: Build 🏗️
    runs-on: ubuntu-latest
    needs: [setup, lint]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Restore workspace 📂
        uses: actions/cache@v3
        with:
          path: .
          key: workspace-${{ github.sha }}

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v2
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Build 🏗️
        run: pnpm build

      - name: Docker build 🐳
        run: pnpm docker:build

      - name: Cache built 💾
        uses: actions/cache@v3
        with:
          path: .
          key: workspace-built-${{ github.sha }}

  test:
    name: Test 🧪
    runs-on: ubuntu-latest
    needs: [setup, build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Restore workspace 📂
        uses: actions/cache@v3
        with:
          path: .
          key: workspace-built-${{ github.sha }}

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v2
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false

      - name: Run tests 🧪
        run: pnpm test
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
